<!DOCTYPE html>

<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Додати Робітника - Construction Management</title>

    <link rel="stylesheet" href="/cssFiles/addWorkerPage.css">


</head>

<body>


<h1>Додати Нового Робітника</h1>


<div id="form-message" style="display: none;"></div>

<div id="loading-indicator" style="display: none;">Обробка...</div>


<form id="add-worker-form">


    <div class="form-group">

        <label for="worker-name">Повне ім'я та прізвище:</label>

        <input type="text" id="worker-name" name="workerName" required>

    </div>


    <div class="form-group">
        <label>Спеціальності / Посади (оберіть одну або декілька):</label>
        <div id="specialties-checkbox-group">
            <div><input type="checkbox" id="spec-shpaklyuvalnyk" name="workerSpecialties" value="Шпаклювальник"><label for="spec-shpaklyuvalnyk"> Шпаклювальник (стіни, стелі)</label></div>
            <div><input type="checkbox" id="spec-malyar" name="workerSpecialties" value="Маляр"><label for="spec-malyar"> Маляр</label></div>
            <div><input type="checkbox" id="spec-laminatchyk" name="workerSpecialties" value="Паркетник/Ламінатчик"><label for="spec-laminatchyk"> Паркетник / Ламінатчик</label></div>
            <div><input type="checkbox" id="spec-plytochnyk" name="workerSpecialties" value="Плиточник"><label for="spec-plytochnyk"> Плиточник</label></div>
            <div><input type="checkbox" id="spec-gipsokartonshchyk" name="workerSpecialties" value="Гіпсокартонщик"><label for="spec-gipsokartonshchyk"> Гіпсокартонщик</label></div>
            <div><input type="checkbox" id="spec-elektryk" name="workerSpecialties" value="Електрик"><label for="spec-elektryk"> Електрик</label></div>
            <div><input type="checkbox" id="spec-riznorobochyy" name="workerSpecialties" value="Різноробочий"><label for="spec-riznorobochyy"> Різноробочий (загальні роботи)</label></div>
        </div>
        <small>Якщо робітник має декілька спеціальностей, оберіть усі відповідні.</small>
    </div>


    <div class="form-group">

        <label for="worker-phone">Контактний телефон:</label>

        <input type="tel" id="worker-phone" name="workerPhone" placeholder="+380 XX XXX XX XX">

    </div>


    <div class="form-group">

        <label for="worker-email">Email (необов'язково):</label>

        <input type="email" id="worker-email" name="workerEmail">

    </div>


    <div class="form-group">

        <label for="worker-rate">Ставка / Вартість години (грн, необов'язково):</label>

        <input type="number" id="worker-rate" name="workerRate" min="0" step="1">

    </div>


    <button type="submit" id="save-worker-button">Додати Робітника в Систему</button>


</form>


<script type="module" src="/src/addWorker.js"></script>
<script>
    const themeToggle = document.querySelector("#theme-toggle");

    // Перевірка, чи є локальне збереження теми
    const userTheme = localStorage.getItem("theme");
    if (userTheme === "dark") {
        document.body.classList.add("dark-mode");
    }

    themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");

        // Зберігаємо тему в localStorage
        if (document.body.classList.contains("dark-mode")) {
            localStorage.setItem("theme", "dark");
        } else {
            localStorage.setItem("theme", "light");
        }
    })
</script>


</body>

</html>
