<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Construction Management - Вхід</title>
  <script type="module" crossorigin src="/assets/main-EOz09uFH.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/main-D92ffyc9.css">
</head>
<body>
<div class="login-container">
    <div class="login-image-side">
        <img src="/assets/logo-DCEAhgn5.jpg" alt="Логотип Construction Management">
        <h2>Construction Management</h2>
        <p>Ефективне управління ремонтними роботами.</p>
    </div>
    <div class="login-form-side">
        <h1>Вхід в Систему</h1>
        <div id="login-message" class="form-message" style="display: none; margin-bottom: 15px; min-height: 1.2em; text-align: center;"></div>
        <form id="login-form" class="auth-form">
            <h3>Введіть дані для входу</h3>
            <div class="form-group">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
                <label for="login-password">Пароль:</label>
                <input type="password" id="login-password" required>
            </div>
            <button id="login-button" class="button" type="submit">Увійти</button>
        </form> <p class="signup-link">Немає акаунту? <a href="/html/registrationPage.html">Зареєструватись</a></p>
        <div id="loading-indicator" style="display: none; text-align: center; padding: 10px; font-style: italic;">Обробка...</div>
    </div>
</div>


</body>
</html>
