<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Construction Management - Вхід</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div class="login-container">
    <div class="login-image-side">
        <img src="Vot-.jpg" alt="Логотип Construction Management">
        <h2>Construction Management</h2>
        <p>Ефективне управління будівельними проектами.</p>
    </div>
    <div class="login-form-side">
        <h1>Вхід в Систему</h1>
        <div id="auth-error" style="color: red; margin-bottom: 15px; min-height: 1.2em; text-align: center;"></div>
        <div id="login-section" class="auth-form"> <h3>Введіть дані для входу</h3>
            <div class="form-group"> <label for="login-email">Email:</label>
                <input type="email" id="login-email" required> </div>
            <div class="form-group"> <label for="login-password">Пароль:</label>
                <input type="password" id="login-password" required> </div>
            <button id="login-button" class="button" type="button">Увійти</button>
        </div>
        <p class="signup-link">Немає акаунту? <a href="#">Зареєструватись</a></p>
    </div>
</div>

<script src=".idea/script.js"></script>
</body>
</html>
