<!doctype html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Construction Management - Вхід</title>
</head>
<body>
<h1>Вхід в Систему</h1>
<div id="auth-error" style="color: red; margin-bottom: 15px;"></div> <div id="login-section" class="auth-form">
    <h3>Введіть дані для входу</h3>
    <div class="form-group">
        <label for="login-email">Email:</label>
        <input type="email" id="login-email" required>
    </div>
    <div class="form-group">
        <label for="login-password">Пароль:</label>
        <input type="password" id="login-password" required>
    </div>
    <button id="login-button" class="button">Увійти</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="/.idea/script.js"></script>

</body>
</html>
